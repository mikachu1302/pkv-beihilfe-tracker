name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# A newer push to the same branch makes the running checks obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Go tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # The app package (main) is built by the "build" job; test the rest here.
      - run: go test ./internal/... ./cmd/...

  checks:
    name: gofmt, vet, race tests, lint, vulncheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: System libraries (GTK3, WebKitGTK 4.1)
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Placeholder for the embedded frontend
        run: mkdir -p frontend/dist && echo '<!doctype html>' > frontend/dist/index.html
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . ; exit 1)
      - name: shellcheck (install scripts)
        run: shellcheck build/linux/install.sh build/linux/nfpm/scripts/postinstall.sh scripts/install.sh
      - run: go vet -tags gtk3 ./...
      - run: go test -race -tags gtk3 ./...
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.6
          install-mode: goinstall
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest -tags gtk3 ./...

  frontend:
    name: Frontend (typecheck, lint, test, build)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: System libraries (needed to load the Go packages for bindings)
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Wails CLI
        run: go install -tags gtk3 github.com/wailsapp/wails/v3/cmd/wails3@v3.1.0
      - run: npm ci
        working-directory: frontend
      - name: Generate TypeScript bindings
        run: wails3 generate bindings -f '-tags gtk3' -clean=true -ts -i
      - run: npm run typecheck
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  build:
    name: App build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # version from git describe
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: System libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Wails CLI
        run: go install ${{ runner.os == 'Linux' && '-tags gtk3' || '' }} github.com/wailsapp/wails/v3/cmd/wails3@v3.1.0
      - name: Build
        run: wails3 task build
