name: Release

# A tag "v1.2.3" builds packages for Windows, macOS and Linux and attaches
# them to a GitHub release. Started by hand, it only uploads the packages as
# workflow artifacts (to try a build without releasing).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: Package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v="${GITHUB_REF_NAME#v}"
          sed -i.bak "s/0\.1\.0/$v/g" build/windows/info.json build/darwin/Info.plist build/windows/nsis/wails_tools.nsh
          sed -i.bak "s/^version: .*/version: \"$v\"/" build/linux/nfpm/nfpm.yaml
      - name: System libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: NSIS (Windows)
        if: runner.os == 'Windows'
        run: choco install nsis -y --no-progress
      - name: Wails CLI
        run: go install ${{ runner.os == 'Linux' && '-tags gtk3' || '' }} github.com/wailsapp/wails/v3/cmd/wails3@v3.1.0

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          wails3 task linux:create:deb
          wails3 task linux:create:rpm
          make dist-linux   # tar.gz with binary, icon, menu entry and install.sh
          cp dist/*.tar.gz bin/   # all packages in one folder: the artifact stays flat
          ls -la bin
      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          export PATH="$PATH:/c/Program Files (x86)/NSIS"
          wails3 task windows:package
          ls -la bin
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          wails3 task darwin:package:universal
          # Readable name in Finder; renaming the bundle keeps the ad-hoc signature.
          mkdir -p dmg
          cp -R bin/pkv-beihilfe-tracker.app "dmg/PKV Beihilfe Tracker.app"
          ln -s /Applications dmg/Programme
          hdiutil create -volname "PKV Beihilfe Tracker" -srcfolder dmg -ov -format UDZO bin/pkv-beihilfe-tracker-macos-universal.dmg
          ditto -c -k --keepParent "dmg/PKV Beihilfe Tracker.app" bin/pkv-beihilfe-tracker-macos-universal.zip
          ls -la bin

      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ runner.os }}
          if-no-files-found: error
          path: |
            bin/*.deb
            bin/*.rpm
            bin/*.tar.gz
            bin/*-installer.exe
            bin/*.dmg
            bin/*.zip

  release:
    name: GitHub release
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes "Installation: siehe docs/INSTALLATION.md im Repository.

          - Linux: .rpm (Fedora) oder .deb (Debian/Ubuntu); ohne Root: .tar.gz entpacken und ./install.sh ausführen.
          - macOS: .dmg öffnen und die App in „Programme“ ziehen (Universal: Intel und Apple Silicon, ad-hoc signiert). Beim ersten Start unter Systemeinstellungen → Datenschutz & Sicherheit „Dennoch öffnen“ wählen.
          - Windows: Installer starten; SmartScreen-Hinweis über „Weitere Informationen → Trotzdem ausführen“ bestätigen.
          - Linux und macOS per Skript: sh scripts/install.sh (lädt dieses Release mit der GitHub-CLI)."
