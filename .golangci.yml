version: "2"

run:
  build-tags: [gtk3]

linters:
  enable:
    - bodyclose
    - errcheck
    - errorlint
    - govet
    - ineffassign
    - misspell
    - revive
    - staticcheck
    - unused
  settings:
    misspell:
      # German words such as "erstattungsfähiger" contain "higer".
      ignore-rules:
        - higer
        - konfiguration
    errcheck:
      exclude-functions:
        - (io.Closer).Close
        - (io.ReadCloser).Close
        - (*os.File).Close
        - (*github.com/xuri/excelize/v2.File).Close
        - os.Remove
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: increment-decrement
        - name: var-naming
        - name: range
        - name: receiver-naming
        - name: indent-error-flow
        - name: errorf
        - name: unreachable-code
        - name: redefines-builtin-id
  exclusions:
    rules:
      # Tests may ignore errors of setup helpers (writing fixtures, etc.).
      - path: _test\.go
        linters: [errcheck]
      # Service and backup return German messages that the UI shows as they
      # are; German nouns start with a capital letter.
      - path: internal/(service|backup)/
        linters: [staticcheck]
        text: "ST1005"


formatters:
  enable:
    - gofmt
