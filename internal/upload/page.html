<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Beleg senden</title>
<style>
  :root { color-scheme: light dark; --accent: #2f6fde; --bg: #f7f8fa; --panel: #fff; --text: #1c2430; --muted: #5e6b7a; --good: #1e8a4c; --bad: #c53030; }
  @media (prefers-color-scheme: dark) { :root { --bg: #14181e; --panel: #1c222b; --text: #e4e8ee; --muted: #97a3b2; --good: #4cc282; --bad: #f07272; } }
  body { margin: 0; background: var(--bg); color: var(--text); font: 17px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 480px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 22px; margin: 0 0 8px; }
  p { color: var(--muted); margin: 0 0 20px; }
  label.btn { display: block; text-align: center; padding: 16px; border-radius: 12px; margin-bottom: 12px; font-weight: 600; cursor: pointer; }
  label.primary { background: var(--accent); color: #fff; }
  label.secondary { background: var(--panel); border: 1px solid var(--muted); }
  input[type=file] { display: none; }
  ul { list-style: none; padding: 0; margin: 20px 0 0; }
  li { background: var(--panel); border-radius: 12px; padding: 10px; margin-bottom: 8px;
       display: grid; grid-template-columns: 48px minmax(0, 1fr) auto; align-items: center; gap: 12px; }
  .thumb { width: 48px; height: 48px; border-radius: 8px; object-fit: cover; background: var(--bg);
           display: grid; place-items: center; font-size: 12px; font-weight: 700; color: var(--muted); }
  .name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .meta { font-size: 14px; color: var(--muted); overflow-wrap: anywhere; }
  .state { font-size: 15px; font-weight: 600; white-space: nowrap; color: var(--muted); }
  .ok { color: var(--good); } .err { color: var(--bad); }
</style>
</head>
<body>
<main>
  <h1>Beleg an den Computer senden</h1>
  <p>Rechnungen oder Erstattungsbescheide fotografieren oder als PDF wählen. Sie landen sofort im Posteingang der App.</p>
  <label class="btn primary">Foto aufnehmen<input id="camera" type="file" accept="image/*" capture="environment"></label>
  <label class="btn secondary">Fotos oder PDF wählen<input id="files" type="file" accept="image/*,application/pdf" multiple></label>
  <ul id="list"></ul>
</main>
<script>
  const list = document.getElementById("list");
  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text) e.textContent = text;
    return e;
  }
  function size(bytes) {
    return bytes >= 1048576 ? (bytes / 1048576).toFixed(1).replace(".", ",") + " MB" : Math.max(1, Math.round(bytes / 1024)) + " KB";
  }
  // One card per file: preview, name (shortened with … if long), size or error, status.
  async function send(file) {
    const li = el("li");
    let thumb;
    if (file.type.startsWith("image/")) {
      thumb = el("img", "thumb");
      thumb.alt = "";
      thumb.src = URL.createObjectURL(file);
      thumb.onload = () => URL.revokeObjectURL(thumb.src);
      thumb.onerror = () => { // not a picture the phone can show (e.g. HEIC on some devices)
        URL.revokeObjectURL(thumb.src);
        thumb.replaceWith(el("div", "thumb", "Bild"));
      };
    } else {
      thumb = el("div", "thumb", file.type === "application/pdf" ? "PDF" : "Datei");
    }
    const info = el("div");
    const name = el("div", "name", file.name || "Foto");
    name.title = file.name || "";
    const meta = el("div", "meta", size(file.size));
    info.append(name, meta);
    const state = el("span", "state", "wird gesendet …");
    li.append(thumb, info, state);
    list.prepend(li);
    try {
      const res = await fetch(location.pathname, {method: "POST", headers: {"Content-Type": file.type || "application/octet-stream"}, body: file});
      const text = await res.text();
      if (!res.ok) throw new Error(text.trim());
      state.textContent = "✓ gesendet";
      state.className = "state ok";
    } catch (e) {
      state.textContent = "✗ Fehler";
      state.className = "state err";
      meta.textContent = e.message || "Die Verbindung zum Computer ist abgebrochen.";
      meta.className = "meta err";
    }
  }
  for (const id of ["camera", "files"]) {
    document.getElementById(id).addEventListener("change", e => {
      for (const f of e.target.files) send(f);
      e.target.value = "";
    });
  }
</script>
</body>
</html>
