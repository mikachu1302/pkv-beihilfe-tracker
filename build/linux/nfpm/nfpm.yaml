# Linux packages (.deb, .rpm) built by `wails3 task linux:create:deb|rpm`.
# Documentation: https://nfpm.goreleaser.com

name: "pkv-beihilfe-tracker"
arch: ${GOARCH}
platform: "linux"
version: "0.1.0" # set from the tag by the release workflow
section: "misc"
priority: "optional"
maintainer: "mikachu1302"
description: "Arztrechnungen, Beihilfe und PKV im Blick"
vendor: "mikachu1302"
homepage: "https://github.com/mikachu1302/pkv-beihilfe-tracker"
license: "proprietary"
release: "1"

contents:
  - src: "./bin/pkv-beihilfe-tracker"
    dst: "/usr/bin/pkv-beihilfe-tracker"
  - src: "./build/appicon.svg"
    dst: "/usr/share/icons/hicolor/scalable/apps/pkv-beihilfe-tracker.svg"
  - src: "./build/linux/pkv-beihilfe-tracker.desktop"
    dst: "/usr/share/applications/pkv-beihilfe-tracker.desktop"

# The app is built with the gtk3 tag: GTK 3 and WebKitGTK 4.1 (Debian/Ubuntu names).
depends:
  - libgtk-3-0
  - libwebkit2gtk-4.1-0

overrides:
  rpm: # Fedora, RHEL, AlmaLinux, Rocky Linux
    depends:
      - gtk3
      - webkit2gtk4.1
  archlinux:
    depends:
      - gtk3
      - webkit2gtk-4.1

# Updates the menu and icon caches after installing.
scripts:
  postinstall: "./build/linux/nfpm/scripts/postinstall.sh"
